global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'campusbuddy-backend-local'
    static_configs:
      - targets: ['backend:5000']

  - job_name: 'campusbuddy-backend-production'
    metrics_path: '/metrics'
    scheme: 'https'
    static_configs:
      - targets: ['campusbuddy-cxak.onrender.com']
