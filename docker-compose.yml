version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: campusbuddy_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    image: campusbuddy-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusbuddy_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/campusbuddy
      - JWT_SECRET=campusbuddy_super_secret_jwt_key_2024
      - PORT=5000
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    image: campusbuddy-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusbuddy_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
